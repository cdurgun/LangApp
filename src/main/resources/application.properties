spring.application.name=langapp

# --- PostgreSQL ---
# Ortam degiskeni varsa onu kullan, yoksa yerel gelistirme icin varsayilana don.
# Railway/Render gibi platformlarda bu degiskenleri kendin tanimlayacaksin.



spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/langapp}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:langapp_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# validate: semayi Hibernate degil, Flyway migration'lari yonetir (db/migration).
# Hicbir zaman canlida 'update' kullanma - beklenmedik sema degisikliklerine yol acar.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true

# --- Thymeleaf ------
spring.thymeleaf.cache=false

# --- Actuator (saglik kontrolu icin - Railway/Render bunu kullanabilir) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Railway/Render gibi platformlar PORT degiskenini kendileri atar.
server.port=${PORT:8080}
