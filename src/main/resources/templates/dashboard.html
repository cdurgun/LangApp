<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Panel')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container">
    <div class="card">
        <h1 th:text="'Merhaba, ' + ${user.username} + '!'">Merhaba!</h1>
        <p>Hedef dilin: <strong th:text="${user.targetLanguage == 'ru'} ? 'Rusça' : 'İngilizce'">İngilizce</strong></p>
        <p>Genel doğruluk oranı: <strong th:text="${accuracy} + '%'">0%</strong></p>
        <p>Güncel seri: <strong th:text="${user.currentStreak} + ' gün'">0 gün</strong>
           (en uzun seri: <span th:text="${user.longestStreak}">0</span>)</p>
    </div>

    <div class="card">
        <h2>Pratik Yap</h2>
        <a class="btn" th:href="@{/practice/words}">Kelime Listesi</a>
        <a class="btn" th:href="@{/practice/flashcards}">Kelime Kartları</a>
        <a class="btn" th:href="@{/practice/quiz}">Quiz</a>
        <a class="btn" th:href="@{/practice/translation}">Çeviri</a>
    </div>

    <div class="card">
        <h2>Konu Bazında İlerleme</h2>
        <div th:if="${#lists.isEmpty(progressList)}">
            <p>Henüz pratik yapmadın. Hemen başla!</p>
        </div>
        <div th:each="p : ${progressList}" style="margin-bottom: 14px;">
            <div th:text="${p.topic.name} + ' (' + ${p.topic.level} + ') — ' + ${p.masteryLevel} + '%'"></div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" th:style="'width:' + ${p.masteryLevel} + '%'"></div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
