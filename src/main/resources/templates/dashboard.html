<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{nav.dashboard})}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container">
    <div class="card">
        <h1 th:text="#{dashboard.greeting(${user.username})}">Merhaba!</h1>
        <p><span th:text="#{dashboard.targetLanguage}"></span>
           <strong th:text="${user.targetLanguage == 'ru'} ? #{register.lang.ru} : #{register.lang.en}">İngilizce</strong></p>
        <p><span th:text="#{dashboard.accuracy}"></span> <strong th:text="${accuracy} + '%'">0%</strong></p>
        <p><span th:text="#{dashboard.streak}"></span> <strong th:text="#{dashboard.streak.days(${user.currentStreak})}">0 gün</strong>
           (<span th:text="#{dashboard.streak.longest}"></span> <span th:text="${user.longestStreak}">0</span>)</p>
    </div>

    <div class="card">
        <h2 th:text="#{dashboard.practice.title}">Pratik Yap</h2>
        <a class="btn" th:href="@{/practice/words}" th:text="#{nav.wordlist}">Kelime Listesi</a>
        <a class="btn" th:href="@{/practice/flashcards}" th:text="#{nav.flashcards}">Kelime Kartları</a>
        <a class="btn" th:href="@{/practice/quiz}" th:text="#{nav.quiz}">Quiz</a>
        <a class="btn" th:href="@{/practice/translation}" th:text="#{nav.translation}">Çeviri</a>
    </div>

    <div class="card">
        <h2 th:text="#{dashboard.progress.title}">Konu Bazında İlerleme</h2>
        <div th:if="${#lists.isEmpty(progressList)}">
            <p th:text="#{dashboard.progress.empty}">Henüz pratik yapmadın. Hemen başla!</p>
        </div>
        <div th:each="p : ${progressList}" style="margin-bottom: 14px;">
            <div th:text="${p.topic.name} + ' (' + ${p.topic.level} + ') — ' + ${p.masteryLevel} + '%'"></div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" th:style="'width:' + ${p.masteryLevel} + '%'"></div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
