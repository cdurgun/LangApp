<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{login.title})}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container">
    <div class="card">
        <h1 th:text="#{login.title}">Giriş Yap</h1>
        <p th:if="${param.error}" class="error" th:text="#{login.error}"></p>
        <p th:if="${param.logout}" class="success" th:text="#{login.logout.success}"></p>
        <p th:if="${param.registered}" class="success" th:text="#{login.registered.success}"></p>

        <form th:action="@{/login}" method="post">
            <label th:text="#{login.username}">Kullanıcı Adı</label>
            <input type="text" name="username" required>
            <label th:text="#{login.password}">Şifre</label>
            <input type="password" name="password" required>
            <button type="submit" th:text="#{login.submit}">Giriş Yap</button>
        </form>
        <p><span th:text="#{login.noAccount}"></span> <a th:href="@{/register}" th:text="#{login.registerLink}">Kayıt ol</a></p>
    </div>
</div>
</body>
</html>
