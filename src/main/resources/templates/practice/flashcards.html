<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{flashcards.title})}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container">
    <div class="card">
        <h1 th:text="#{flashcards.title}">Kelime Kartları</h1>

        <div th:if="${#lists.isEmpty(flashcards)}">
            <p th:text="#{flashcards.empty}">Bu dil için henüz kelime eklenmemiş.</p>
        </div>

        <div th:unless="${#lists.isEmpty(flashcards)}">
            <div id="flashcard-area">
                <div class="flashcard" id="card-text">...</div>
                <button id="speak-btn" type="button" class="link-button speak-btn"
                        style="margin: 0; color: #2b2f77; font-size: 1.1rem;"
                        th:title="#{wordlist.listen}">🔊</button>
                <button id="flip-btn" onclick="flipCard()" th:text="#{flashcards.flip}">Çeviriyi Göster</button>
                <div id="assess-buttons" style="display:none; margin-top:14px;">
                    <button onclick="assess(true)" th:text="#{flashcards.knew}">Biliyordum ✓</button>
                    <button onclick="assess(false)" style="background:#c0392b; margin-left:10px;" th:text="#{flashcards.didntKnow}">Bilmiyordum ✗</button>
                </div>
                <p id="progress-text" style="margin-top:16px; color:#666;"></p>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const cards = /*[[${flashcards}]]*/ [];
    const targetLanguageCode = /*[[${targetLanguage}]]*/ 'en';
    const doneText = /*[[#{flashcards.done}]]*/ 'Tüm kartları bitirdin! 🎉';
    let index = 0;
    let flipped = false;

    const regionalLanguageCodes = {
        en: 'en-US',
        ru: 'ru-RU',
        tr: 'tr-TR'
    };

    function normalizeLanguageCode(languageCode) {
        return regionalLanguageCodes[languageCode] || languageCode;
    }

    function voiceQualityScore(voice, targetLanguage) {
        const name = voice.name.toLowerCase();
        const voiceLanguage = voice.lang.toLowerCase();
        const target = targetLanguage.toLowerCase();
        let score = 0;

        if (voiceLanguage === target) score += 100;
        else if (voiceLanguage.startsWith(target.split('-')[0] + '-')) score += 70;

        if (/natural|neural|enhanced|premium|online/.test(name)) score += 50;
        if (/google|microsoft|apple|siri/.test(name)) score += 20;
        if (voice.localService === false) score += 5;

        return score;
    }

    function selectBestVoice(voices, targetLanguage) {
        return voices
            .filter(voice => voice.lang.toLowerCase().startsWith(targetLanguage.split('-')[0].toLowerCase()))
            .sort((first, second) => voiceQualityScore(second, targetLanguage) - voiceQualityScore(first, targetLanguage))[0];
    }

    function speakCurrentCard() {
        if (index >= cards.length) return;

        const card = cards[index];
        const speakButton = document.getElementById('speak-btn');

        if (card.audioUrl) {
            playAudioFile(card.audioUrl, speakButton, () => speakWithTts(card.sourceText, speakButton));
            return;
        }

        speakWithTts(card.sourceText, speakButton);
    }

    function playAudioFile(url, button, onFallback) {
        const player = new Audio(url);
        if (button) button.setAttribute('aria-busy', 'true');
        const clearBusy = () => { if (button) button.removeAttribute('aria-busy'); };
        player.onended = clearBusy;
        player.onerror = () => { clearBusy(); if (onFallback) onFallback(); };
        player.play().catch(() => { clearBusy(); if (onFallback) onFallback(); });
    }

    function speakWithTts(text, speakButton) {
        if (!('speechSynthesis' in window)) return;

        window.speechSynthesis.cancel();
        const targetLanguage = normalizeLanguageCode(targetLanguageCode);
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = targetLanguage;
        utterance.rate = 0.9;
        if (speakButton) speakButton.setAttribute('aria-busy', 'true');
        utterance.onend = utterance.onerror = () => { if (speakButton) speakButton.removeAttribute('aria-busy'); };

        const speak = () => {
            const preferredVoice = selectBestVoice(window.speechSynthesis.getVoices(), targetLanguage);
            if (preferredVoice) utterance.voice = preferredVoice;
            window.speechSynthesis.speak(utterance);
        };

        if (window.speechSynthesis.getVoices().length === 0) {
            window.speechSynthesis.addEventListener('voiceschanged', speak, { once: true });
        } else {
            speak();
        }
    }

    function renderCard() {
        if (index >= cards.length) {
            document.getElementById('card-text').innerText = doneText;
            document.getElementById('flip-btn').style.display = 'none';
            document.getElementById('assess-buttons').style.display = 'none';
            document.getElementById('progress-text').innerText = '';
            document.getElementById('speak-btn').style.display = 'none';
            return;
        }
        flipped = false;
        document.getElementById('card-text').innerText = cards[index].sourceText;
        document.getElementById('assess-buttons').style.display = 'none';
        document.getElementById('flip-btn').style.display = 'inline-block';
        document.getElementById('speak-btn').style.display = 'inline-block';
        document.getElementById('progress-text').innerText = (index + 1) + ' / ' + cards.length;
    }

    function flipCard() {
        flipped = true;
        document.getElementById('card-text').innerText = cards[index].targetText;
        document.getElementById('assess-buttons').style.display = 'block';
        document.getElementById('flip-btn').style.display = 'none';
    }

    function assess(knewIt) {
        const card = cards[index];
        fetch('/practice/flashcards/' + card.id + '/assess?knewIt=' + knewIt, { method: 'POST' })
            .finally(() => {
                index++;
                renderCard();
            });
    }

    document.getElementById('speak-btn').addEventListener('click', speakCurrentCard);
    renderCard();
</script>
</body>
</html>
