<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Kelime Listesi')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container">
    <div class="card">
        <h1>Kelime Listesi</h1>

        <form th:action="@{/practice/words}" method="get" style="display:flex; gap:10px; align-items:flex-start;">
            <input type="text" name="search" th:value="${search}" placeholder="Kelime ara..." autocomplete="off" style="margin:0;">
            <button type="submit" style="white-space:nowrap;">Ara</button>
            <a th:if="${search != null and !search.isEmpty()}" th:href="@{/practice/words}" class="btn" style="background:#888; white-space:nowrap;">Temizle</a>
        </form>

        <p style="color:#666; margin-top:10px;" th:text="${wordPage.totalElements} + ' kelime bulundu'"></p>

        <div th:if="${wordPage.empty}">
            <p>Sonuç bulunamadı.</p>
        </div>

        <table th:unless="${wordPage.empty}" style="width:100%; border-collapse: collapse; margin-top:10px;">
            <thead>
                <tr style="text-align:left; border-bottom: 2px solid #eee;">
                    <th style="padding:8px;">Kelime</th>
                    <th style="padding:8px;">Karşılığı</th>
                    <th style="padding:8px;">Örnek Cümle</th>
                    <th style="padding:8px;">Konu</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${wordPage.content}" style="border-bottom: 1px solid #f0f0f0;">
                    <td style="padding:8px; font-weight:600;" th:text="${item.sourceText}"></td>
                    <td style="padding:8px;" th:text="${item.targetText}"></td>
                    <td style="padding:8px; color:#666;" th:text="${item.exampleSentence}"></td>
                    <td style="padding:8px; color:#666;" th:text="${item.topic.name} + ' (' + ${item.topic.level} + ')'"></td>
                </tr>
            </tbody>
        </table>

        <!-- Sayfalama -->
        <div th:if="${wordPage.totalPages > 1}" style="margin-top:20px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
            <a th:if="${wordPage.hasPrevious()}"
               th:href="@{/practice/words(page=${wordPage.number - 1}, search=${search})}"
               class="btn">&laquo; Önceki</a>

            <span th:each="i : ${#numbers.sequence(0, wordPage.totalPages - 1)}">
                <a th:href="@{/practice/words(page=${i}, search=${search})}"
                   th:text="${i + 1}"
                   th:style="${i == wordPage.number} ? 'font-weight:700; text-decoration:underline;' : ''"
                   style="margin:0 4px; color:#2b2f77; text-decoration:none;"></a>
            </span>

            <a th:if="${wordPage.hasNext()}"
               th:href="@{/practice/words(page=${wordPage.number + 1}, search=${search})}"
               class="btn">Sonraki &raquo;</a>
        </div>
    </div>
</div>
</body>
</html>
