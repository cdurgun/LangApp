<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{wordlist.title})}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container">
    <div class="card">
        <h1 th:text="#{wordlist.title}">Kelime Listesi</h1>

        <form th:action="@{/practice/words}" method="get" style="display:flex; gap:10px; align-items:flex-start;">
            <input type="text" name="search" th:value="${search}" th:placeholder="#{wordlist.searchPlaceholder}" autocomplete="off" style="margin:0;">
            <button type="submit" style="white-space:nowrap;" th:text="#{wordlist.search}">Ara</button>
            <a th:if="${search != null and !search.isEmpty()}" th:href="@{/practice/words}" class="btn" style="background:#888; white-space:nowrap;" th:text="#{wordlist.clear}">Temizle</a>
        </form>

        <p style="color:#666; margin-top:10px;" th:text="#{wordlist.resultsCount(${wordPage.totalElements})}"></p>

        <div th:if="${wordPage.empty}">
            <p th:text="#{wordlist.empty}">Sonuç bulunamadı.</p>
        </div>

        <table th:unless="${wordPage.empty}" style="width:100%; border-collapse: collapse; margin-top:10px;">
            <thead>
                <tr style="text-align:left; border-bottom: 2px solid #eee;">
                    <th style="padding:8px;" th:text="#{wordlist.col.word}">Kelime</th>
                    <th style="padding:8px;" th:text="#{wordlist.col.translation}">Karşılığı</th>
                    <th style="padding:8px;" th:text="#{wordlist.col.type}">Tür</th>
                    <th style="padding:8px;" th:text="#{wordlist.col.example}">Örnek Cümle</th>
                    <th style="padding:8px;" th:text="#{wordlist.col.topic}">Konu</th>
                    <th style="padding:8px;"></th>
                </tr>
            </thead>
            <tbody>
                <th:block th:each="item : ${wordPage.content}">
                    <tr style="border-bottom: 1px solid #f0f0f0;">
                        <td style="padding:8px; font-weight:600;">
                            <span th:text="${item.sourceText}"></span>
                            <button type="button"
                                    class="link-button speak-btn"
                                    style="margin-left: 5px; color: #2b2f77; font-size: 1.1rem; vertical-align: middle;"
                                    th:attr="data-word=${item.sourceText},data-language=${item.topic.language.code},data-audio-url=${item.audioUrl},title=#{wordlist.listen}">
                                🔊
                            </button>
                        </td>
                        <td style="padding:8px;" th:text="${item.targetText}"></td>
                        <td style="padding:8px;">
                            <span th:if="${item.wordType != null}" th:text="#{${'wordtype.' + item.wordType}}"
                                  style="background:#eef0fb; padding:2px 8px; border-radius:10px; font-size:0.85rem;"></span>
                        </td>
                        <td style="padding:8px; color:#666;" th:text="${item.exampleSentence}"></td>
                        <td style="padding:8px; color:#666;" th:text="${item.topic.name} + ' (' + ${item.topic.level} + ')'"></td>
                        <td style="padding:8px;">
                            <button th:if="${item.wordType != null and item.wordType.name() == 'VERB'}"
                                    type="button"
                                    class="link-button conjugation-toggle"
                                    style="color:#2b2f77; text-decoration:underline; font-size:0.9rem;"
                                    th:attr="onclick=|toggleConjugation(${item.id})|"
                                    th:text="#{wordlist.viewConjugation}">
                                Çekimleri Gör
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${item.wordType != null and item.wordType.name() == 'VERB'}"
                        th:id="'conj-row-' + ${item.id}" style="display:none; background:#fafbff;">
                        <td colspan="6" style="padding:14px 8px;">
                            <div th:id="'conj-content-' + ${item.id}" style="font-size:0.9rem; color:#666;">...</div>
                        </td>
                    </tr>
                </th:block>
            </tbody>
        </table>

        <!-- Sayfalama -->
        <div th:if="${wordPage.totalPages > 1}" style="margin-top:20px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
            <a th:if="${wordPage.hasPrevious()}"
               th:href="@{/practice/words(page=${wordPage.number - 1}, search=${search})}"
               class="btn" th:text="#{wordlist.prev}">&laquo; Önceki</a>

            <span th:each="i : ${#numbers.sequence(0, wordPage.totalPages - 1)}">
                <a th:href="@{/practice/words(page=${i}, search=${search})}"
                   th:text="${i + 1}"
                   th:style="${i == wordPage.number} ? 'font-weight:700; text-decoration:underline;' : ''"
                   style="margin:0 4px; color:#2b2f77; text-decoration:none;"></a>
            </span>

            <a th:if="${wordPage.hasNext()}"
               th:href="@{/practice/words(page=${wordPage.number + 1}, search=${search})}"
               class="btn" th:text="#{wordlist.next}">Sonraki &raquo;</a>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const regionalLanguageCodes = {
        en: 'en-US',
        ru: 'ru-RU',
        tr: 'tr-TR'
    };

    function normalizeLanguageCode(languageCode) {
        return regionalLanguageCodes[languageCode] || languageCode;
    }

    function voiceQualityScore(voice, targetLanguage) {
        const name = voice.name.toLowerCase();
        const voiceLanguage = voice.lang.toLowerCase();
        const target = targetLanguage.toLowerCase();
        let score = 0;

        // Aynı bölgenin sesi, yalnızca aynı dil ailesinden bir sesten daha doğaldır.
        if (voiceLanguage === target) score += 100;
        else if (voiceLanguage.startsWith(target.split('-')[0] + '-')) score += 70;

        // İşletim sistemi ve tarayıcıların yüksek kaliteli sesleri bu ifadeleri kullanır.
        if (/natural|neural|enhanced|premium|online/.test(name)) score += 50;
        if (/google|microsoft|apple|siri/.test(name)) score += 20;
        if (voice.localService === false) score += 5;

        return score;
    }

    function selectBestVoice(voices, targetLanguage) {
        return voices
            .filter(voice => voice.lang.toLowerCase().startsWith(targetLanguage.split('-')[0].toLowerCase()))
            .sort((first, second) => voiceQualityScore(second, targetLanguage) - voiceQualityScore(first, targetLanguage))[0];
    }

    function speakWord(text, languageCode, button, audioUrl) {
        if (audioUrl) {
            playAudioFile(audioUrl, button, () => speakWithTts(text, languageCode, button));
            return;
        }
        speakWithTts(text, languageCode, button);
    }

    function playAudioFile(url, button, onFallback) {
        const player = new Audio(url);
        if (button) button.setAttribute('aria-busy', 'true');
        const clearBusy = () => { if (button) button.removeAttribute('aria-busy'); };
        player.onended = clearBusy;
        player.onerror = () => { clearBusy(); if (onFallback) onFallback(); };
        player.play().catch(() => { clearBusy(); if (onFallback) onFallback(); });
    }

    function speakWithTts(text, languageCode, button) {
        if (!('speechSynthesis' in window)) {
            alert('Your browser does not support speech synthesis.');
            return;
        }

        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        const targetLanguage = normalizeLanguageCode(languageCode);
        utterance.lang = targetLanguage;
        utterance.rate = 0.9;

        if (button) button.setAttribute('aria-busy', 'true');
        utterance.onend = utterance.onerror = () => {
            if (button) button.removeAttribute('aria-busy');
        };

        const speak = () => {
            const preferredVoice = selectBestVoice(window.speechSynthesis.getVoices(), targetLanguage);
            if (preferredVoice) utterance.voice = preferredVoice;
            window.speechSynthesis.speak(utterance);
        };

        if (window.speechSynthesis.getVoices().length === 0) {
            window.speechSynthesis.addEventListener('voiceschanged', speak, { once: true });
        } else {
            speak();
        }
    }

    document.querySelectorAll('.speak-btn').forEach(button => {
        button.addEventListener('click', () => {
            speakWord(button.dataset.word, button.dataset.language, button, button.dataset.audioUrl);
        });
    });

    const loadedConjugations = {};

    // Sunucudan gelen mesaj anahtarlarini JS'e tasiyoruz - boylece cekim
    // panelindeki metinler de aktif dile gore degisiyor.
    const i18n = {
        pairToPerfective: /*[[#{conjugation.pairToPerfective}]]*/ 'Bitmiş karşılığı:',
        pairToImperfective: /*[[#{conjugation.pairToImperfective}]]*/ 'Bitmemiş karşılığı:',
        pairMissing: /*[[#{conjugation.pairMissing}]]*/ 'eşleşen fiil henüz eklenmemiş',
        aspectLabel: /*[[#{conjugation.aspectLabel}]]*/ 'Görünüş (Aspect):',
        present: /*[[#{conjugation.present}]]*/ 'Şimdiki Zaman',
        future: /*[[#{conjugation.future}]]*/ 'Gelecek Zaman',
        imperative: /*[[#{conjugation.imperative}]]*/ 'Emir Kipi',
        notAvailable: /*[[#{conjugation.notAvailable}]]*/ 'Bu fiil için çekim bilgisi henüz eklenmemiş.',
        dash: /*[[#{conjugation.dash}]]*/ '—',
        pronoun1s: /*[[#{pronoun.1s}]]*/ 'ben',
        pronoun2s: /*[[#{pronoun.2s}]]*/ 'sen',
        pronoun3s: /*[[#{pronoun.3s}]]*/ 'o',
        pronoun1p: /*[[#{pronoun.1p}]]*/ 'biz',
        pronoun2p: /*[[#{pronoun.2p}]]*/ 'siz',
        pronoun3p: /*[[#{pronoun.3p}]]*/ 'onlar'
    };

    function toggleConjugation(id) {
        const row = document.getElementById('conj-row-' + id);
        if (!row) return;

        if (row.style.display === 'none') {
            row.style.display = 'table-row';
            if (!loadedConjugations[id]) {
                loadConjugation(id);
            }
        } else {
            row.style.display = 'none';
        }
    }

    function loadConjugation(id) {
        const contentDiv = document.getElementById('conj-content-' + id);
        fetch('/practice/words/' + id + '/conjugation')
            .then(res => {
                if (!res.ok) throw new Error('not found');
                return res.json();
            })
            .then(data => {
                loadedConjugations[id] = true;
                contentDiv.innerHTML = renderConjugationTable(data);
            })
            .catch(() => {
                contentDiv.innerHTML = '<em>' + i18n.notAvailable + '</em>';
            });
    }

    function cell(value) {
        return value ? value : '<span style="color:#bbb;">' + i18n.dash + '</span>';
    }

    function renderConjugationTable(d) {
        let aspectHtml = '';
        if (d.aspectLabel) {
            const pairHtml = d.pairSourceText
                ? `<strong>${d.pairSourceText}</strong> <span style="color:#666;">(${d.pairTargetText})</span>`
                : '<span style="color:#bbb;">' + i18n.pairMissing + '</span>';
            const pairLabel = d.aspectCode === 'IMPERFECTIVE' ? i18n.pairToPerfective : i18n.pairToImperfective;
            aspectHtml = `
                <div style="margin-bottom:14px; padding:10px 14px; background:#eef0fb; border-radius:8px;">
                    <strong>${i18n.aspectLabel}</strong> ${d.aspectLabel}
                    &nbsp;·&nbsp;
                    <strong>${pairLabel}</strong> ${pairHtml}
                </div>
            `;
        }

        return aspectHtml + `
            <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:20px;">
                <div>
                    <strong>${i18n.present}</strong>
                    <table style="width:100%; margin-top:6px;">
                        <tr><td>${i18n.pronoun1s}</td><td>${cell(d.present1s)}</td></tr>
                        <tr><td>${i18n.pronoun2s}</td><td>${cell(d.present2s)}</td></tr>
                        <tr><td>${i18n.pronoun3s}</td><td>${cell(d.present3s)}</td></tr>
                        <tr><td>${i18n.pronoun1p}</td><td>${cell(d.present1p)}</td></tr>
                        <tr><td>${i18n.pronoun2p}</td><td>${cell(d.present2p)}</td></tr>
                        <tr><td>${i18n.pronoun3p}</td><td>${cell(d.present3p)}</td></tr>
                    </table>
                </div>
                <div>
                    <strong>${i18n.future}</strong>
                    <table style="width:100%; margin-top:6px;">
                        <tr><td>${i18n.pronoun1s}</td><td>${cell(d.future1s)}</td></tr>
                        <tr><td>${i18n.pronoun2s}</td><td>${cell(d.future2s)}</td></tr>
                        <tr><td>${i18n.pronoun3s}</td><td>${cell(d.future3s)}</td></tr>
                        <tr><td>${i18n.pronoun1p}</td><td>${cell(d.future1p)}</td></tr>
                        <tr><td>${i18n.pronoun2p}</td><td>${cell(d.future2p)}</td></tr>
                        <tr><td>${i18n.pronoun3p}</td><td>${cell(d.future3p)}</td></tr>
                    </table>
                </div>
                <div>
                    <strong>${i18n.imperative}</strong>
                    <table style="width:100%; margin-top:6px;">
                        <tr><td>${i18n.pronoun2s}</td><td>${cell(d.imperativeSingular)}</td></tr>
                        <tr><td>${i18n.pronoun2p}</td><td>${cell(d.imperativePlural)}</td></tr>
                    </table>
                </div>
            </div>
        `;
    }
</script>
</body>
</html>
