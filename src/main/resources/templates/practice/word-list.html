<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Kelime Listesi')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container">
    <div class="card">
        <h1>Kelime Listesi</h1>

        <form th:action="@{/practice/words}" method="get" style="display:flex; gap:10px; align-items:flex-start;">
            <input type="text" name="search" th:value="${search}" placeholder="Kelime ara..." autocomplete="off" style="margin:0;">
            <button type="submit" style="white-space:nowrap;">Ara</button>
            <a th:if="${search != null and !search.isEmpty()}" th:href="@{/practice/words}" class="btn" style="background:#888; white-space:nowrap;">Temizle</a>
        </form>

        <p style="color:#666; margin-top:10px;" th:text="${wordPage.totalElements} + ' kelime bulundu'"></p>

        <div th:if="${wordPage.empty}">
            <p>Sonuç bulunamadı.</p>
        </div>

        <table th:unless="${wordPage.empty}" style="width:100%; border-collapse: collapse; margin-top:10px;">
            <thead>
                <tr style="text-align:left; border-bottom: 2px solid #eee;">
                    <th style="padding:8px;">Kelime</th>
                    <th style="padding:8px;">Karşılığı</th>
                    <th style="padding:8px;">Tür</th>
                    <th style="padding:8px;">Örnek Cümle</th>
                    <th style="padding:8px;">Konu</th>
                    <th style="padding:8px;"></th>
                </tr>
            </thead>
            <tbody>
                <th:block th:each="item : ${wordPage.content}">
                    <tr style="border-bottom: 1px solid #f0f0f0;">
                        <td style="padding:8px; font-weight:600;" th:text="${item.sourceText}"></td>
                        <td style="padding:8px;" th:text="${item.targetText}"></td>
                        <td style="padding:8px;">
                            <span th:if="${item.wordType != null}" th:text="${item.wordType.turkishLabel}"
                                  style="background:#eef0fb; padding:2px 8px; border-radius:10px; font-size:0.85rem;"></span>
                        </td>
                        <td style="padding:8px; color:#666;" th:text="${item.exampleSentence}"></td>
                        <td style="padding:8px; color:#666;" th:text="${item.topic.name} + ' (' + ${item.topic.level} + ')'"></td>
                        <td style="padding:8px;">
                            <button th:if="${item.wordType != null and item.wordType.name() == 'VERB'}"
                                    type="button"
                                    class="link-button conjugation-toggle"
                                    style="color:#2b2f77; text-decoration:underline; font-size:0.9rem;"
                                    th:attr="onclick=|toggleConjugation(${item.id})|">
                                Çekimleri Gör
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${item.wordType != null and item.wordType.name() == 'VERB'}"
                        th:id="'conj-row-' + ${item.id}" style="display:none; background:#fafbff;">
                        <td colspan="6" style="padding:14px 8px;">
                            <div th:id="'conj-content-' + ${item.id}" style="font-size:0.9rem; color:#666;">Yükleniyor...</div>
                        </td>
                    </tr>
                </th:block>
            </tbody>
        </table>

        <!-- Sayfalama -->
        <div th:if="${wordPage.totalPages > 1}" style="margin-top:20px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
            <a th:if="${wordPage.hasPrevious()}"
               th:href="@{/practice/words(page=${wordPage.number - 1}, search=${search})}"
               class="btn">&laquo; Önceki</a>

            <span th:each="i : ${#numbers.sequence(0, wordPage.totalPages - 1)}">
                <a th:href="@{/practice/words(page=${i}, search=${search})}"
                   th:text="${i + 1}"
                   th:style="${i == wordPage.number} ? 'font-weight:700; text-decoration:underline;' : ''"
                   style="margin:0 4px; color:#2b2f77; text-decoration:none;"></a>
            </span>

            <a th:if="${wordPage.hasNext()}"
               th:href="@{/practice/words(page=${wordPage.number + 1}, search=${search})}"
               class="btn">Sonraki &raquo;</a>
        </div>
    </div>
</div>

<script>
    const loadedConjugations = {};

    function toggleConjugation(id) {
        const row = document.getElementById('conj-row-' + id);
        if (!row) return;

        if (row.style.display === 'none') {
            row.style.display = 'table-row';
            if (!loadedConjugations[id]) {
                loadConjugation(id);
            }
        } else {
            row.style.display = 'none';
        }
    }

    function loadConjugation(id) {
        const contentDiv = document.getElementById('conj-content-' + id);
        fetch('/practice/words/' + id + '/conjugation')
            .then(res => {
                if (!res.ok) throw new Error('Çekim bulunamadı');
                return res.json();
            })
            .then(data => {
                loadedConjugations[id] = true;
                contentDiv.innerHTML = renderConjugationTable(data);
            })
            .catch(() => {
                contentDiv.innerHTML = '<em>Bu fiil için çekim bilgisi henüz eklenmemiş.</em>';
            });
    }

    function cell(value) {
        return value ? value : '<span style="color:#bbb;">—</span>';
    }

    function renderConjugationTable(d) {
        let aspectHtml = '';
        if (d.aspect) {
            const pairHtml = d.pairSourceText
                ? `<strong>${d.pairSourceText}</strong> <span style="color:#666;">(${d.pairTargetText})</span>`
                : '<span style="color:#bbb;">eşleşen fiil henüz eklenmemiş</span>';
            aspectHtml = `
                <div style="margin-bottom:14px; padding:10px 14px; background:#eef0fb; border-radius:8px;">
                    <strong>Görünüş (Aspect):</strong> ${d.aspect}
                    &nbsp;·&nbsp;
                    <strong>${d.aspect === 'Bitmemiş' ? 'Bitmiş' : 'Bitmemiş'} karşılığı:</strong> ${pairHtml}
                </div>
            `;
        }

        return aspectHtml + `
            <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:20px;">
                <div>
                    <strong>Şimdiki Zaman</strong>
                    <table style="width:100%; margin-top:6px;">
                        <tr><td>ben</td><td>${cell(d.present1s)}</td></tr>
                        <tr><td>sen</td><td>${cell(d.present2s)}</td></tr>
                        <tr><td>o</td><td>${cell(d.present3s)}</td></tr>
                        <tr><td>biz</td><td>${cell(d.present1p)}</td></tr>
                        <tr><td>siz</td><td>${cell(d.present2p)}</td></tr>
                        <tr><td>onlar</td><td>${cell(d.present3p)}</td></tr>
                    </table>
                </div>
                <div>
                    <strong>Gelecek Zaman</strong>
                    <table style="width:100%; margin-top:6px;">
                        <tr><td>ben</td><td>${cell(d.future1s)}</td></tr>
                        <tr><td>sen</td><td>${cell(d.future2s)}</td></tr>
                        <tr><td>o</td><td>${cell(d.future3s)}</td></tr>
                        <tr><td>biz</td><td>${cell(d.future1p)}</td></tr>
                        <tr><td>siz</td><td>${cell(d.future2p)}</td></tr>
                        <tr><td>onlar</td><td>${cell(d.future3p)}</td></tr>
                    </table>
                </div>
                <div>
                    <strong>Emir Kipi</strong>
                    <table style="width:100%; margin-top:6px;">
                        <tr><td>sen</td><td>${cell(d.imperativeSingular)}</td></tr>
                        <tr><td>siz</td><td>${cell(d.imperativePlural)}</td></tr>
                    </table>
                </div>
            </div>
        `;
    }
</script>
</body>
</html>
