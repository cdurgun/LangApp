<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{register.title})}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container">
    <div class="card">
        <h1 th:text="#{register.title}">Kayıt Ol</h1>
        <p th:if="${errorMessage}" class="error" th:text="${errorMessage}"></p>

        <form th:action="@{/register}" th:object="${registerForm}" method="post">
            <label th:text="#{register.username}">Kullanıcı Adı</label>
            <input type="text" th:field="*{username}">
            <span class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>

            <label th:text="#{register.email}">E-posta</label>
            <input type="email" th:field="*{email}">
            <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

            <label th:text="#{register.password}">Şifre</label>
            <input type="password" th:field="*{password}">
            <span class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>

            <label th:text="#{register.targetLanguage}">Pratik yapmak istediğin dil</label>
            <select th:field="*{targetLanguage}">
                <option value="en" th:text="#{register.lang.en}">İngilizce</option>
                <option value="ru" th:text="#{register.lang.ru}">Rusça</option>
            </select>

            <button type="submit" th:text="#{register.submit}">Kayıt Ol</button>
        </form>
        <p><span th:text="#{register.haveAccount}"></span> <a th:href="@{/login}" th:text="#{register.loginLink}">Giriş yap</a></p>
    </div>
</div>
</body>
</html>
