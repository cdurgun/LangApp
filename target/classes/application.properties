spring.application.name=langapp

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/langapp
spring.datasource.username=langapp_user
spring.datasource.password=changeme
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# update: gelistirme icin entity'lerden semayi otomatik olusturur/gunceller.
# Prod'a gecerken 'validate' yapip Flyway/Liquibase ile migration yonetmeni oneririm.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Thymeleaf ---
spring.thymeleaf.cache=false

server.port=8080
