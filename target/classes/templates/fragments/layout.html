<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <title th:text="${title} + ' - LangApp'">LangApp</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:fragment="navbar" class="navbar">
    <a th:href="@{/dashboard}" class="brand">LangApp</a>
    <div class="nav-links" sec:authorize="isAuthenticated()" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
        <a th:href="@{/dashboard}">Panel</a>
        <a th:href="@{/practice/words}">Kelime Listesi</a>
        <a th:href="@{/practice/flashcards}">Kelime Kartları</a>
        <a th:href="@{/practice/quiz}">Quiz</a>
        <a th:href="@{/practice/translation}">Çeviri</a>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <button type="submit" class="link-button">Çıkış</button>
        </form>
    </div>
</nav>
</body>
</html>
