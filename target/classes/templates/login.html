<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Giriş Yap')}"></head>
<body>
<div class="container">
    <div class="card">
        <h1>Giriş Yap</h1>
        <p th:if="${param.error}" class="error">Kullanıcı adı veya şifre hatalı.</p>
        <p th:if="${param.logout}" class="success">Başarıyla çıkış yaptınız.</p>
        <p th:if="${param.registered}" class="success">Kayıt tamamlandı, şimdi giriş yapabilirsiniz.</p>

        <form th:action="@{/login}" method="post">
            <label>Kullanıcı Adı</label>
            <input type="text" name="username" required>
            <label>Şifre</label>
            <input type="password" name="password" required>
            <button type="submit">Giriş Yap</button>
        </form>
        <p>Hesabın yok mu? <a th:href="@{/register}">Kayıt ol</a></p>
    </div>
</div>
</body>
</html>
